; Salin ke /etc/supervisor/conf.d/tarombobatak.conf lalu sesuaikan path/user.

[program:tarombobatak-mtproto]
directory=/var/www/tarombobatak
command=/usr/bin/php artisan telegram:mtproto-listen --all
process_name=%(program_name)s
numprocs=1
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tarombobatak-mtproto.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10

[program:tarombobatak-queue]
directory=/var/www/tarombobatak
command=/usr/bin/php artisan queue:work database --sleep=3 --tries=3 --timeout=120 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tarombobatak-queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10

[program:tarombobatak-reverb]
directory=/var/www/tarombobatak
command=/usr/bin/php artisan reverb:start
process_name=%(program_name)s
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tarombobatak-reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
