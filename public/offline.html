<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarombo Batak - Offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #fdfcf7; color: #2b2118; font-family: system-ui, sans-serif; text-align: center; }
        img { width: 96px; height: 96px; }
        button { margin-top: 16px; border: 0; border-radius: 8px; padding: 10px 18px; background: #b34b1e; color: #fff; font-weight: 600; }
        @media (prefers-color-scheme: dark) { body { background: #1c1714; color: #f3ece4; } }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>Sedang offline</h1>
        <p>Periksa koneksi internet, lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
</body>
</html>
